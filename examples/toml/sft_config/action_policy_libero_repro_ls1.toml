# ============================================================================
# LIBERO action-policy SFT — "ls1" A/B variant of action_policy_libero_repro.
#
# WHAT DIFFERS FROM action_policy_libero_repro.toml:
#   * Global loss scale removed: loss_scale 10->1 AND action_loss_weight 10->1.
#     These two live in model.config.rectified_flow_training_config and are NOT
#     expressible in this TOML schema, so the launch wrapper
#     (examples/launch_sft_action_policy_libero_ls1.sh) applies them as trailing
#     Hydra opts. Relative vision:action balance is UNCHANGED (1:1); only the
#     global magnitude drops 10x. Under FusedAdam a global loss scale is ~no-op
#     on the update direction (Adam normalizes it out); its only real effect was
#     saturating grad_clip(clip_norm=1.0). This run tests whether the 10x was
#     ever doing anything but clipping.
#   * Single-node topology identical to run20 (replicate=1, grad_accum=2 ->
#     128 x shard8 x ga2 = 2048 global batch). A 2-node HSDP variant (replicate=2,
#     grad_accum=1, same 2048) halves wall-clock when two full 8-GPU nodes are
#     co-schedulable; this run used 1 node as that was what the cluster had free.
#   * 2000 iters, checkpoint every 500 (run20 saved every 1000).
#
# Everything else (optimizer, lr=5e-5 + 5x action-head multipliers, LR schedule
# cycle=10000/warmup=2000 so the per-iter LR matches run20 exactly, count-based
# batch, dataset knobs, action-head skip-on-load) is identical to repro.toml so
# this is a clean A/B against run20's 94.6% @ iter_2000.
#
# Launch (2 nodes x 8 GPU): bash examples/launch_sft_action_policy_libero_ls1.sh
# (with NNODES/NODE_RANK/MASTER_ADDR set per node — see the Lepton spec).
# ============================================================================

[job]
task         = "vfm"
experiment   = "action_policy_libero_nano"
project      = "cosmos3_action_libero"
group        = "action_sft"
name         = "action_policy_libero_repro_ls1"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8    # 8-GPU FSDP shard (single node)
data_parallel_replicate_degree = 1    # 1 node; set 2 for 2-node HSDP (with grad_accum_iter=1)

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [10000]   # match run20's LR trajectory (NOT max_iter) for a clean A/B
warm_up_steps = [2000]

[trainer]
max_iter        = 2000
logging_iter    = 50
grad_accum_iter = 2       # global batch = 128 x shard8 x ga2 = 2048 (== run20)

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500           # checkpoint every 500 iters (500/1000/1500/2000)
