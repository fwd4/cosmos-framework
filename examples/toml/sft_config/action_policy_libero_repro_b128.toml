# ============================================================================
# LIBERO action-policy SFT — "b128" variant: small global batch (128) to match
# the paper / issue-#50 regime (~2.7 passes over libero_10 in 2000 steps ≈ 97%).
#
# WHY: action_policy_libero_repro.toml uses max_samples_per_batch=128 with
# shard8 x grad_accum2 = GLOBAL BATCH 2048 -> ~43 passes over libero_10's ~95k
# windows in 2000 steps (heavy over-training). The paper's ~97% was reached with
# ~2.7 passes, i.e. an effective global batch of ~128. This recipe reproduces
# THAT regime exactly and deterministically.
#
# GLOBAL BATCH = max_samples_per_batch x (shard x replicate) x grad_accum.
#   HSDP 2x8 = shard8 (within a node) x replicate2 (across 2 nodes) = 16 ranks;
#   max_samples_per_batch=8 (set at launch via dataloader_train.max_samples_per_batch=8);
#   grad_accum=1 -> 8 x 16 x 1 = 128. (8 samples/rank is far below any token
#   budget, so no samples are dropped and the token cap is irrelevant -> removed below.)
#
# Loss is the GA default (loss_scale=10, action_loss_weight=10) — NOT overridden.
#
# Launch (2 nodes x 8 GPU = HSDP 2x8):
#   bash examples/launch_sft_action_policy_libero_b128.sh
#   (with NNODES/NODE_RANK/MASTER_ADDR per node — see the Lepton spec).
# ============================================================================

[job]
task         = "vfm"
experiment   = "action_policy_libero_nano"
project      = "cosmos3_action_libero"
group        = "action_sft"
name         = "action_policy_libero_repro_b128"
wandb_mode   = "online"

[model]
precision = "bfloat16"
# Keep the reference value 74000 (run20 + reference action_policy_sft_nano use this).
# An earlier b128 run set this to -1 ("removed") AND encode_exact_durations=[17];
# both deviated from the reference and regressed the policy to 60.8% (vs 94.6%).
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8    # HSDP: model sharded across 8 GPUs (one full node, intra-node NVLink)
data_parallel_replicate_degree = 2    # 2 replicas (one per node) -> 16 ranks total (2 nodes)

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [10000]   # match the GA LR trajectory (paper used these at batch 128)
warm_up_steps = [2000]

[trainer]
max_iter        = 2000
logging_iter    = 50
grad_accum_iter = 1       # global batch = max_samples(8) x 16 ranks x ga1 = 128

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
